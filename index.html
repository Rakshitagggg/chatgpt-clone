<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>ChatGPT Clone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="brand-button" id="newChatButton" aria-label="Start a new chat">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2.2 14.1 4l.1 2.8 2.7.8 2-1.9 2.2 2.2-1.9 2 0.8 2.7H22v3.1h-2.8l-1.2 2.5 1.9 2-2.2 2.2-2-1.9-2.7.8-.1 2.8-3.1.1-.1-2.8-2.7-.8-2 1.9-2.2-2.2 1.9-2-.8-2.7H2.1v-3.1h2.8l.8-2.7-1.9-2 2.2-2.2 2 1.9 2.7-.8L11 2.2h1Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </span>
        <span>New chat</span>
      </button>
      <button class="icon-button sidebar-toggle-desktop" id="desktopToggle" aria-label="Close sidebar">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M6 8h.01M6 12h.01"/></svg>
      </button>
    </div>

    <nav class="history" aria-label="Chat history">
      <div class="history-group">
        <p class="history-label">Today</p>
        <div id="chatList"></div>
      </div>
    </nav>

    <div class="sidebar-footer">
      <button class="profile-button" id="profileButton">
        <span class="avatar">R</span>
        <span class="profile-copy">
          <strong>Rakshita</strong>
          <small>Free</small>
        </span>
        <svg class="dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
      </button>
    </div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="main-panel">
    <header class="topbar">
      <button class="icon-button mobile-menu" id="mobileMenu" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button class="model-button" id="modelButton">ChatGPT <span>⌄</span></button>
      <button class="share-button" id="shareButton" aria-label="Share chat">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.5M8.2 13.2l7.6 4.5"/></svg>
      </button>
    </header>

    <section class="chat-stage" id="chatStage">
      <div class="empty-state" id="emptyState">
        <div class="empty-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2.2 14.1 4l.1 2.8 2.7.8 2-1.9 2.2 2.2-1.9 2 0.8 2.7H22v3.1h-2.8l-1.2 2.5 1.9 2-2.2 2.2-2-1.9-2.7.8-.1 2.8-3.1.1-.1-2.8-2.7-.8-2 1.9-2.2-2.2 1.9-2-.8-2.7H2.1v-3.1h2.8l.8-2.7-1.9-2 2.2-2.2 2 1.9 2.7-.8L11 2.2h1Z" fill="none" stroke="currentColor" stroke-width="1.25"/><circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.25"/></svg>
        </div>
        <h1>What can I help with?</h1>
      </div>
      <div class="messages" id="messages" aria-live="polite"></div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="messageInput" rows="1" placeholder="Message ChatGPT" aria-label="Message ChatGPT"></textarea>
        <div class="composer-actions">
          <button type="button" class="composer-action" id="attachButton" aria-label="Attach file">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button type="button" class="composer-action tools-button" id="toolsButton">
            <svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.5"/></svg>
            <span>Tools</span>
          </button>
          <button type="submit" class="send-button" id="sendButton" aria-label="Send message" disabled>
            <svg viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 5v14"/></svg>
          </button>
        </div>
      </form>
      <p class="disclaimer">ChatGPT can make mistakes. Check important info.</p>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
